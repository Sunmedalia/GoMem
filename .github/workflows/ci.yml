name: verify-development-preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath ./cmd/gomem
      - run: go run ./cmd/gomem doctor --offline
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test -race -timeout 30m ./...
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/build_argument_fixtures.py --check
      - run: python3 tools/build_inode_mode_oracle.py --check
      - run: python3 tools/fetch_baseline.py
      - run: python3 -m pip install pefile==2024.8.26 Pillow==12.2.0
      - run: python3 tools/build_service_oracle.py --check
      - run: python3 tools/build_vad_oracle.py --check
      - run: python3 tools/build_suspicious_thread_oracle.py --check
      - run: python3 tools/build_hollowprocess_oracle.py --check
      - run: python3 tools/build_psxview_oracle.py --check
      - run: python3 tools/build_processghosting_oracle.py --check
      - run: python3 tools/build_pebmasquerade_oracle.py --check
      - run: python3 tools/build_process_spoofing_oracle.py --check
      - run: python3 tools/build_capability_oracle.py --check
      - run: python3 tools/build_check_creds_oracle.py --check
      - run: python3 tools/build_boottime_oracle.py --check
      - run: python3 tools/build_iomem_oracle.py --check
      - run: python3 tools/build_linux_ip_oracle.py --check
      - run: python3 tools/build_vmcoreinfo_oracle.py --check
      - run: python3 tools/build_modxview_oracle.py --check
      - run: python3 tools/build_module_params_oracle.py --check
      - run: python3 tools/build_module_elf_oracle.py --check
      - run: python3 tools/build_netfilter_oracle.py --check
      - run: python3 tools/build_malfind_oracle.py --check
      - run: python3 tools/build_library_list_oracle.py --check
      - run: python3 tools/build_ebpf_oracle.py --check
      - run: python3 tools/build_pidhashtable_oracle.py --check
      - run: python3 tools/build_kmsg_oracle.py --check
      - run: python3 tools/build_perf_events_oracle.py --check
      - run: python3 tools/build_fbdev_oracle.py --check
      - run: python3 tools/build_tracepoints_oracle.py --check
      - run: python3 tools/build_ftrace_oracle.py --check
      - run: python3 tools/build_kthreads_oracle.py --check
      - run: python3 tools/build_afinfo_oracle.py --check
      - run: python3 tools/build_idt_oracle.py --check
      - run: python3 tools/build_syscall_oracle.py --check
      - run: python3 tools/build_keyboard_oracle.py --check
      - run: python3 tools/build_ptrace_oracle.py --check
      - run: python3 tools/build_linux_pstree_oracle.py --check
      - run: python3 tools/baseline_matrix.py --source .cache/volatility3-881e970121c16f0932fb9d16fbd5fb258cbcbf75 --check
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxTracepointAcquisition -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxFtraceAcquisition -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxFramebufferAcquisition -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxFramebufferPixels -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxPerfEvents -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxKmsgRings -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxPIDHash -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxEBPFIDR -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxLibraryList -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxMalfindDisassembly -fuzztime 5s
      - run: go test ./pkg/memory -run '^$' -fuzz FuzzDetect -fuzztime 5s
      - run: go test ./pkg/memory -run '^$' -fuzz FuzzAVML -fuzztime 5s
      - run: go test ./pkg/memory -run '^$' -fuzz FuzzSnappyBlock -fuzztime 5s
      - run: go test ./pkg/memory -run '^$' -fuzz FuzzPointerScan -fuzztime 5s
      - run: go test ./pkg/pe -run '^$' -fuzz FuzzMappedPEReconstruction -fuzztime 5s
      - run: go test ./pkg/object -run '^$' -fuzz FuzzLinuxIntrusiveTrees -fuzztime 5s
      - run: go test ./pkg/linuxcache -run '^$' -fuzz FuzzPageCacheTree -fuzztime 5s
      - run: go test ./pkg/elfimage -run '^$' -fuzz FuzzELFHeaders -fuzztime 5s
      - run: go test ./pkg/elfimage -run '^$' -fuzz FuzzModuleELFRebuild -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxVMAMetadata -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzWindowsCommandLineUTF16 -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzWindowsVADTraversal -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxArgumentDisplay -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxClockArithmetic -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzVMCoreInfoDescriptor -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxModuleParameterGraph -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxModuleMemoryLayouts -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxModuleELFSymbols -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxInodeTimestamp -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxUnixEndpoint -fuzztime 5s
      - run: go test ./internal/engine -run '^$' -fuzz FuzzMappedPE -fuzztime 5s
      - run: go test ./pkg/symbols -run '^$' -fuzz FuzzISF -fuzztime 5s
      - run: go test ./pkg/symbols -run '^$' -fuzz FuzzDWARF -fuzztime 5s
      - run: go test ./pkg/symbols -run '^$' -fuzz FuzzSymbolIndex -fuzztime 5s
      - run: go test ./pkg/symbols -run '^$' -fuzz FuzzMSF -fuzztime 5s
      - run: go test ./pkg/symbols -run '^$' -fuzz FuzzCodeView -fuzztime 5s
