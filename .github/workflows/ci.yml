name: verify-development-preview
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath ./cmd/gomem
      - run: go run ./cmd/gomem doctor --offline
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test -race ./...
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/build_argument_fixtures.py --check
      - run: python3 tools/build_inode_mode_oracle.py --check
      - run: python3 tools/fetch_baseline.py
      - run: python3 -m pip install pefile==2024.8.26
      - run: python3 tools/build_service_oracle.py --check
      - run: python3 tools/baseline_matrix.py --source .cache/volatility3-881e970121c16f0932fb9d16fbd5fb258cbcbf75 --check
      - run: go test ./pkg/memory -run '^$' -fuzz FuzzDetect -fuzztime 5s
      - run: go test ./pkg/memory -run '^$' -fuzz FuzzAVML -fuzztime 5s
      - run: go test ./pkg/memory -run '^$' -fuzz FuzzSnappyBlock -fuzztime 5s
      - run: go test ./pkg/memory -run '^$' -fuzz FuzzPointerScan -fuzztime 5s
      - run: go test ./pkg/pe -run '^$' -fuzz FuzzMappedPEReconstruction -fuzztime 5s
      - run: go test ./pkg/object -run '^$' -fuzz FuzzLinuxIntrusiveTrees -fuzztime 5s
      - run: go test ./pkg/linuxcache -run '^$' -fuzz FuzzPageCacheTree -fuzztime 5s
      - run: go test ./pkg/elfimage -run '^$' -fuzz FuzzELFHeaders -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxVMAMetadata -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzWindowsCommandLineUTF16 -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxArgumentDisplay -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxClockArithmetic -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxInodeTimestamp -fuzztime 5s
      - run: go test ./internal/plugins -run '^$' -fuzz FuzzLinuxUnixEndpoint -fuzztime 5s
      - run: go test ./internal/engine -run '^$' -fuzz FuzzMappedPE -fuzztime 5s
      - run: go test ./pkg/symbols -run '^$' -fuzz FuzzISF -fuzztime 5s
      - run: go test ./pkg/symbols -run '^$' -fuzz FuzzDWARF -fuzztime 5s
      - run: go test ./pkg/symbols -run '^$' -fuzz FuzzSymbolIndex -fuzztime 5s
      - run: go test ./pkg/symbols -run '^$' -fuzz FuzzMSF -fuzztime 5s
      - run: go test ./pkg/symbols -run '^$' -fuzz FuzzCodeView -fuzztime 5s
