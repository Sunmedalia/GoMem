name: verify-development-preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./pkg/winconsole -run ConsoleCatalog -count=5
      - run: go test ./pkg/wingui -run GUICatalog -count=5
      - run: go test -timeout 30m ./...
      - run: go build -trimpath ./cmd/gomem
      - run: go run ./cmd/gomem doctor --offline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go run ./cmd/gomem plugins --format json > native-plugins.json
      - run: python tools/audit_v01.py --plugins native-plugins.json --check
  engine-race:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/test_engine_shard.py --shard ${{ matrix.shard }} --manifest engine-tests-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-tests-${{ matrix.shard }}
          path: engine-tests-${{ matrix.shard }}.json
          if-no-files-found: error
  # Count budgets avoid Go 1.26 timed-fuzz shutdown races (golang/go#82362).
  # Calibration and per-target budgets: docs/ci-fuzz-budgets.json.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/test_engine_shard.py --other-packages
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/build_argument_fixtures.py --check
      - run: python3 tools/build_inode_mode_oracle.py --check
      - run: python3 tools/fetch_baseline.py
      - run: python3 -m pip install pefile==2024.8.26 Pillow==12.2.0 yara-x==1.9.0
      - run: python3 tools/build_service_oracle.py --check
