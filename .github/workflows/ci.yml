name: verify-development-preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -timeout 30m ./...
      - run: go build -trimpath ./cmd/gomem
      - run: go run ./cmd/gomem doctor --offline
  engine-race:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/test_engine_shard.py --shard ${{ matrix.shard }} --manifest engine-tests-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-tests-${{ matrix.shard }}
          path: engine-tests-${{ matrix.shard }}.json
          if-no-files-found: error
  # Count budgets avoid Go 1.26 timed-fuzz shutdown races (golang/go#82362).
  # Calibration and per-target budgets: docs/ci-fuzz-budgets.json.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
